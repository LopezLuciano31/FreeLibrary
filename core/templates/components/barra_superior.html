{% load static %}

<!--Barra superior negra-->
<div class="superior" id="up">
	<div class="interior">
		<!--Aqui va el algo a la izquierda-->
		<div class="izquierda">
			<img src="{% static 'img/fcfmyn.png' %} " style="width: 200px; height: 50px">
		</div>
		<!--Aqui esta el boton de donar y el de seleccionar el idioma-->
		<div class="derecha">
			<div class="botonDonar">
				<div class="field">
					<div class="control">
						<button class="button is-danger is-outlined is-small">
							<span>Donar</span>
							<span class="icon">
								<i class="fas fa-heart"></i>
							</span>
						</button>
					</div>
				</div>
			</div>
			<div class="botonIdioma colorIdioma">
				<div class="field">
					<div class="control">
						<span class="select is-small">
							<select name="" id="">
								<option value="">Español</option>
								<option value="">Ingles</option>
								<option value="">Frances</option>
							</select>
						</span>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
