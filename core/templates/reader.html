<!DOCTYPE html>
{% load static %}
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free LibraryReader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/reader.css' %}">
</head>
<button id="openMenu" onclick="openMenu()" title="Toggle continuous scroll">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
    <rect x="4" y="5" width="16" height="2" rx="1" fill="white"/>
    <rect x="4" y="11" width="16" height="2" rx="1" fill="white"/>
    <rect x="4" y="17" width="16" height="2" rx="1" fill="white"/>
  </svg>
</button>
<body>
 <div id="viewer" class="spreads" ></div>
 <div id="sideMenu" class="sideMenu">
  <a href="#" title="Favorite" class="icon is-large">
  <i id="star" class="far fa-star"></i>
</a>
   <a href="javascript:void(0)" class="closebtn" onclick="closeMenu()">&times;</a>
<aside class="menu">
  <ul class="menu-list">
      <li><a id="changeMode" onclick="changeMode()">Cambiar modo lector</a>
      </li>
      <li>
        <a>Capitulo:</a>
        <select id="toc"></select> 
      </li>
      <li>
        <a> Agregar a una lista.</a>
      </li>
      <li>
        <a>Modo:</a>
          <div class="ball-container">
            
            <a class="icon is-medium" onclick="changeModeAnotation('highlight')" >
              <i class="fas fa-highlighter"></i>
            </a>
            <a class="icon is-medium" onclick="changeModeAnotation('underline')">
                <i class="fas fa-underline"></i>
            </a>
            <a class="icon is-medium" onclick="changeModeAnotation('remove')">
              <i class="fas fa-eraser"></i>
          </a>
          <a class="icon is-medium" onclick="changeModeAnotation('')">
            <i class="fas fa-xmark"></i>
        </a>
          </div>
        </li>
      <li>
      <div class="ball-container">
        <a> Color:</a>
        <div class="color-ball"  style="background-color:#f44;" onclick="changeColor('red')" ></div>
        <div class="color-ball"  style="background-color:#48f;" onclick="changeColor('blue')"></div>
        <div class="color-ball"  style="background-color:#4f4;" onclick="changeColor('green')"></div>
        <div class="color-ball"  style="background-color:#f4f;" onclick="changeColor('pink')"></div>
        <div class="color-ball"  style="background-color:#ff4;" onclick="changeColor('yellow')"></div>
        <div class="color-ball"  style="background-color:#4ff;" onclick="changeColor('cian')"></div>
      </div>
    </div>
      </li>

  </ul>
</aside>
 </div>
  <script>
    function changeMode(){
      var currentFlow = localStorage.getItem('mode');
      currentFlow = (currentFlow === "paginated") ? "scrolled" : "paginated";
      localStorage.setItem('mode',currentFlow);
      rendition.flow(currentFlow);
      document.getElementById("viewer").classList.toggle("single");

   }
  </script>
    <script>
          var color = "blue";
      var modeAno="highlight";
           function changeColor(hex){
      color=hex;
    }
    function changeModeAnotation(choice){
      modeAno=choice;
      }
    var mode = localStorage.getItem('mode');
    if (mode == null) {
      localStorage.setItem('mode','paginated');
      mode =  'paginated';
    }
    if(mode=="scrolled"){
    document.getElementById("viewer").classList.toggle("single");
    }
    const urlParams = new URLSearchParams(window.location.search)  && new URLSearchParams(document.location.search.substring(1)); 
    const bookUrl = urlParams.get('book');
    var book = ePub(bookUrl);
    var rendition = book.renderTo("viewer", {
         manager: "continuous",
         flow: mode,
           width: "100%",
           height: "100%",
    });
    book.ready.then(() => {
      const bkey = book.key();
      console.log("Book key:", bkey); 
      rendition.on("relocated", (location) => {
      localStorage.setItem(bkey, location.start.cfi);
                 }
      );
      var lastPage=localStorage.getItem(bkey);
      if(lastPage){
      rendition.display(lastPage);
      }else{
      rendition.display();
      }
      var keyListener = function(e){

          const isRTL = book.package.metadata.direction === "rtl";

          if (["ArrowRight", "ArrowDown"].includes(e.key)) {
              isRTL ? rendition.prev() : rendition.next();
              e.preventDefault();
              }
          if (["ArrowLeft", "ArrowUp"].includes(e.key)) {
              isRTL ? rendition.next() : rendition.prev();
              e.preventDefault();
          }
           

      }
      function isCFIRangeIncluded(cfiRange1, cfiRange2) {
        const match1 = cfiRange1.match(/^epubcfi\(([^,]+),([^,]+),([^)]+)\)$/);
        const match2 = cfiRange2.match(/^epubcfi\(([^,]+),([^,]+),([^)]+)\)$/);
        const baseCFI1 = match1[1];       
        const startCFI1 = `epubcfi(${baseCFI1}${match1[2]})`;
        const endCFI1 = `epubcfi(${baseCFI1}${match1[3]})`; 
        const baseCFI2 = match2[1];       
        const startCFI2 = `epubcfi(${baseCFI2}${match2[2]})`;
        const endCFI2 = `epubcfi(${baseCFI2}${match2[3]})`; 
        console.log("StartCFI1:", startCFI1);
        console.log("StartCFI2:", startCFI2);
        console.log("EndCFI1:", endCFI1);
        console.log("EndCFI2:", endCFI2);
        const resultStart = ePub.CFI.prototype.compare(startCFI1, startCFI2);
        const resultEnd = ePub.CFI.prototype.compare(endCFI1, endCFI2);
        console.log(resultStart);
        console.log(resultEnd);
        return resultStart >= 0 && resultEnd <= 0;
}
      rendition.on("keyup", keyListener);
      document.addEventListener("keyup", keyListener, false);
      var highlights = JSON.parse(localStorage.getItem(bkey+"highlights")) || [];
      rendition.on("selected", function(cfiRange, contents) {
        const higl = {cfiRange, color,modeAno};
        if (modeAno === "highlight") {
            rendition.annotations.highlight(cfiRange, {}, () => {}, "fill-" + color);
            highlights.push(higl);
            localStorage.setItem(bkey+"highlights", JSON.stringify(highlights));

        } else if (modeAno === "underline") {
            rendition.annotations.underline(cfiRange, {}, () => {}, "stroke-" + color);
            highlights.push(higl);
            localStorage.setItem(bkey+"highlights", JSON.stringify(highlights));

        } else if (modeAno === "remove") {

          highlights.forEach(highlight => {
            if(isCFIRangeIncluded(highlight.cfiRange, cfiRange)){
              rendition.annotations.remove(highlight.cfiRange, highlight.modeAno);
             }  
                  });
                  const saveLocal = highlights.filter(highlight => !isCFIRangeIncluded(highlight.cfiRange, cfiRange));
                  console.log(saveLocal);
                  console.log(highlights)
                  localStorage.setItem(bkey+"highlights", JSON.stringify(saveLocal));
              
                }

   
      
        });
 
      highlights.forEach((highlight) => {
      if(highlight.modeAno=="highlight"){
          rendition.annotations.highlight(highlight.cfiRange,{}, () => {},"fill-"+highlight.color);}
      if(highlight.modeAno=="underline"){
          rendition.annotations.underline(highlight.cfiRange,{},() => {},"stroke-"+highlight.color);
      }
});

    });

      function openMenu() {
      document.getElementById("sideMenu").style.width = "250px";
      document.getElementById("openMenu").style.display = "none";

    }
    function closeMenu() {
      document.getElementById("sideMenu").style.width = "0";
      document.getElementById("openMenu").style.display = "block";
    }

      book.loaded.navigation.then(function(toc){
			var	docfrag = document.createDocumentFragment();
      var $select = document.getElementById("toc");

			toc.forEach(function(chapter) {
				var option = document.createElement("option");
				option.textContent = chapter.label;
	      option.value = chapter.href;
				docfrag.appendChild(option);
			});

			$select.appendChild(docfrag);

			$select.onchange = function(){
					var index = $select.selectedIndex,
				  url = $select.options[index].value;
					rendition.display(url);
					return false;
			};

		});

    $(document).on('submit', '#addFavorites', function(e){
    e.preventDefault();

    $.ajax({
        type: 'GET',
        url: '{% url "favorites" %}', 
        data: $(this).serialize(),
        success: function(response) {
            if (response.success) {
              $star.removeClass('fa-regular fa-star');
              $star.addClass('fa-solid fa-star');
            } else {
              $star.removeClass('fa-solid fa-star ');
              $star.addClass('fa-regular fa-star');
            }
        },
        error: function(xhr) {
            const res = xhr.responseJSON;
            
        }
    });
});


  </script>
</body>
</html>
